name: Build Mixosa OS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

- name: Build ISO using Docker
        run: |
          docker build -t mixosa-builder -f Dockerfile.archiso .
          mkdir -p build
          docker run --rm --privileged -v $(pwd):/workspace mixosa-builder mkarchiso -v -w /workspace/work -o /workspace/build/ /workspace/live_build
