# /etc/pacman.conf for the Mixosa OS Archiso profile

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The official repositories are resolved through the mirrorlist supplied by
# the Archiso build environment.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enable this section only when adding a custom signed repository.
#[multilib]
#Include = /etc/pacman.d/mirrorlist
